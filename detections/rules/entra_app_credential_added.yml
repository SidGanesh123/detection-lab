title: Credential Added to Application or Service Principal
id: f686a283-440c-4ebb-afd2-45d186f05dce
status: experimental
description: >
  Detects a new credentials being added to an application
  or service principal. An attacker can add a credential to an existing applcation that
  already holds privileged Graph permissions, to autenticate to the applcation. 
  No user, survives password reset.
author: Siddharth Ganesh
date: 2026/10/17
references:
  - https://attack.mitre.org/techniques/T1098/001/
tags:
  - attack.persistence
  - attack.t1098.001
logsource:
  product: azure
  service: auditlogs
detection:
  selection:
    properties.message:
      - 'Add service principal credentials'
      - 'Update application - Certificates and secrets management'
  condition: selection
falsepositives:
  - Planned secret rotation, which should correspond to a change record
  - CI/CD pipelines that rotate their own credentials on a schedule
level: high

